services:
  jsonhero:
    build: .
    network_mode: host
    environment:
      SESSION_SECRET: change-me-before-use
      OFFLINE: "true"
    volumes:
      - jsonhero-kv:/data/kv
    entrypoint:
      - /bin/sh
      - -c
      - |
        printf 'SESSION_SECRET=%s\nOFFLINE=true\n' "$$SESSION_SECRET" > .env
        exec npm run start:docker
    restart: unless-stopped

volumes:
  jsonhero-kv:
