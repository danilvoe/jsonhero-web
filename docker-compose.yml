services:
  jsonhero:
    build: .
    ports:
      - "8787:8787"
    environment:
      SESSION_SECRET: change-me-before-use
      OFFLINE: "true"
    volumes:
      - jsonhero-kv:/data/kv
    entrypoint:
      - /bin/sh
      - -c
      - |
        printf 'SESSION_SECRET=%s\nOFFLINE=true\n' "$$SESSION_SECRET" > .env
        exec npm run start:docker
    restart: unless-stopped
    networks:
      - jsonhero-internal

networks:
  jsonhero-internal:
    internal: true

volumes:
  jsonhero-kv:
